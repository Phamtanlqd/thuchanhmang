<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Giáo Viên</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { flex: 1; padding: 20px; border-radius: 8px; color: white; text-align: center; }
        .bg-success { background: var(--success); }
        .bg-danger { background: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: var(--primary); color: white; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">👨‍🏫 Quản lý lớp học (Giáo viên)</div>
        <nav><a href="index.html">Về trang học sinh</a></nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>📊 Tiến độ lớp học - Bài 5</h2>
            <div class="stats">
                <div class="stat-box bg-success">
                    <h3>Đã nộp bài</h3>
                    <h1 id="submitted-count">--</h1>
                </div>
                <div class="stat-box bg-danger">
                    <h3>Chưa nộp</h3>
                    <h1 id="missing-count">--</h1>
                </div>
            </div>

            <h3>Danh sách học sinh</h3>
            <table>
                <thead>
                    <tr>
                        <th>Họ tên</th>
                        <th>Minh chứng Chia sẻ</th>
                        <th>Link Dự án (Tiết 4)</th>
                        <th>Đánh giá AI Challenge</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="student-data">
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
